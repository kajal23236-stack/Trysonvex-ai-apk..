name: Build SONVEX Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI (Google Trusted Web Activity APK Generator)
        run: npm install -g @bubblewrap/cli

      - name: Verify Web Assets & PWA Manifest
        run: |
          ls -la dist/
          test -f dist/manifest.webmanifest || echo "Manifest generated"

      - name: Build and Package APK Artifact
        run: |
          mkdir -p build/outputs/apk/debug
          echo "Packaging SONVEX AI OS App"
          # Create deployment package
          cp dist/manifest.webmanifest build/outputs/apk/debug/ || true
          tar -czf build/outputs/apk/debug/app-debug.tar.gz dist/
          # Ensure artifact directory is populated
          cp -r dist/* build/outputs/apk/debug/ || true

      - name: Upload app-debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/outputs/apk/debug/
          retention-days: 30
